<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Gantt</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="prototype.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="p4m {{rootCls}}" style="font-family: 'Source Sans 3', sans-serif; color: #333; min-height: 100%">
<dc-import name="Header" show-new="{{showNew}}" hint-size="100%,50px"></dc-import>
<div class="shell">
<dc-import name="Sidebar" active="p-gantt" show-new="{{showNew}}" hint-size="200px,1000px"></dc-import>
<main class="content">
<div class="content-header">
<a class="pname" href="#">A Prometheus</a>
<nav class="crumb" aria-label="Breadcrumb"><a href="Dashboard.dc.html">Dashboard</a><span>&gt;</span><a href="#">A Prometheus</a><span>&gt;</span><b>Gantt Cal</b></nav>
</div>

<section class="box box-primary">
<div class="box-header"><h3 class="box-title">{{title}}</h3>
<div class="tabs" style="border: 0"><span>Days</span><span class="on">Weeks</span><span>Months</span></div></div>
<div class="chips is-new" style="padding-top: 0">
<span class="small muted" style="margin-right: 4px">Scope</span>
<sc-for list="{{scopes}}" as="s" hint-placeholder-count="2"><button class="{{s.cls}}" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}">{{s.label}}</button></sc-for>
</div>
<div class="scroll-x" style="padding: 0 10px 12px">
<div class="plan">
<div class="hcell" style="grid-row: 1; grid-column: 1; border-left: 0">{{laneHead}}</div>
<sc-for list="{{weeks}}" as="w" hint-placeholder-count="8"><div class="{{w.cls}}" style="grid-row: 1; grid-column: {{w.col}}">{{w.t}}</div></sc-for>
<sc-for list="{{lanes}}" as="l" hint-placeholder-count="6"><div class="lane" style="grid-row: {{l.row}}; grid-column: 1"><span class="sw {{l.pc}}"></span>{{l.name}}</div></sc-for>
<sc-for list="{{cells}}" as="c" hint-placeholder-count="48"><div class="{{c.cls}}" style="grid-row: {{c.row}}; grid-column: {{c.col}}"></div></sc-for>
<sc-for list="{{bars}}" as="b" hint-placeholder-count="9"><a href="#" class="bar {{b.pc}}" style="grid-row: {{b.row}}; grid-column: {{b.span}}; color: #fff">{{b.t}}</a></sc-for>
</div>
</div>
<div class="box-footer small muted" style="text-align: left">{{foot}}</div>
</section>

<section class="box box-danger" style="margin-top: 15px">
<div class="box-header"><h3 class="box-title">Waiting on Another Project</h3><span class="label label-danger">{{blockedN}}</span></div>
<div class="dtbl">
<div class="dtr"><div class="th" style="width: 34%">Issue</div><div class="th" style="width: 34%">Blocked by</div><div class="th" style="width: 16%">Blocker status</div><div class="th" style="width: 16%">Milestone</div></div>
<sc-for list="{{blocked}}" as="b" hint-placeholder-count="3"><div class="dtr"><div class="td"><span class="sw {{b.pc}}"></span> <a class="num" href="#">{{b.num}}</a> {{b.s}}</div><div class="td"><span class="sw {{b.bpc}}"></span> <a class="num" href="#">{{b.bnum}}</a> {{b.bs}}</div><div class="td"><span class="label {{b.stc}}">{{b.stl}}</span></div><div class="td">{{b.ms}}</div></div></sc-for>
</div>
</section>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showNew":{"editor":"boolean","default":true,"section":"Prototype"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const ws = (this.state && this.state.scope) === 'ws';
    const wk = ['16 Nov', '23 Nov', '30 Nov', '7 Dec', '14 Dec', '21 Dec', '28 Dec', '4 Jan'];
    const laneDefs = ws ? [
      { name: 'Spans projects', pc: 'p-ws' }, { name: 'A Gaia', pc: 'p-agaia' }, { name: 'A Prometheus', pc: 'p-aprom' },
      { name: 'A Hermes', pc: 'p-ah' }, { name: 'A Ares', pc: 'p-aa' }, { name: 'A Dev Tool', pc: 'p-adt' }
    ] : [
      { name: 'Workspaces v1', pc: 'p-aprom' }, { name: 'aga-editor', pc: 'p-aprom' }, { name: 'Claude-v1', pc: 'p-aprom' }
    ];
    const lanes = laneDefs.map((l, i) => Object.assign({ row: i + 2 }, l));
    const cells = [];
    lanes.forEach((l) => { wk.forEach((w, j) => { cells.push({ row: l.row, col: j + 2, cls: 'cell' + (j === 1 ? ' today' : '') }); }); });
    const B = (row, from, to, t, pc) => ({ row: row, span: (from + 2) + ' / ' + (to + 2), t: t, pc: pc });
    const bars = ws ? [
      B(2, 0, 5, 'Workspaces v1 · 3 projects · 35%', 'p-ws'),
      B(2, 5, 8, 'Repositories in Gaia · 2 projects', 'p-ws'),
      B(3, 0, 3, 'Workspace model + sync', 'p-agaia'),
      B(3, 5, 7, 'Repository model', 'p-agaia'),
      B(4, 4, 7, 'Workspace link + scope switch', 'p-aprom'),
      B(4, 0, 4, 'aga-editor', 'p-aprom'),
      B(5, 2, 5, 'Workspace room', 'p-ah'),
      B(6, 0, 4, 'Claude-v1', 'p-aa'),
      B(7, 0, 3, 'Talos 2', 'p-adt'),
      B(7, 6, 8, 'Repos from Gaia', 'p-adt')
    ] : [
      B(2, 1, 3, 'aprom-4810 Workspace link', 'p-aprom'),
      B(2, 3, 5, 'aprom-4811 Scope switch', 'p-aprom'),
      B(3, 0, 2, 'aprom-4760 Toolbar', 'p-aprom'),
      B(3, 2, 4, 'aprom-4761 Mentions', 'p-aprom'),
      B(4, 0, 1, 'aprom-4752', 'p-aprom')
    ];
    const blockedAll = [
      { num: 'aprom-4810', s: 'Workspace link', pc: 'p-aprom', bnum: 'agaia-4801', bs: 'Workspace model', bpc: 'p-agaia', stc: 'st-in_progress', stl: 'In Progress', ms: 'Workspaces v1' },
      { num: 'aprom-4811', s: 'Scope switch', pc: 'p-aprom', bnum: 'agaia-4801', bs: 'Workspace model', bpc: 'p-agaia', stc: 'st-in_progress', stl: 'In Progress', ms: 'Workspaces v1' },
      { num: 'adt-4590', s: 'Talos reads repos', pc: 'p-adt', bnum: 'agaia-4820', bs: 'Repository model', bpc: 'p-agaia', stc: 'st-new', stl: 'New', ms: 'Repositories in Gaia' }
    ];
    const SC = [{ id: 'project', label: 'This project' }, { id: 'ws', label: 'Whole workspace · 5 projects' }];
    const cur = ws ? 'ws' : 'project';
    return {
      showNew: this.props.showNew ?? true,
      rootCls: (this.props.showNew ?? true) ? 'shownew' : '',
      title: ws ? 'Milestones by Project' : 'A Prometheus Milestones',
      laneHead: ws ? 'Project' : 'Milestone',
      foot: ws ? 'One lane per project you are a member of, plus a top lane for milestones that span projects. The red line is today.' : 'Today\'s Gantt, unchanged. The red line is today.',
      scopes: SC.map((s) => ({ label: s.label, cls: 'chip' + (s.id === cur ? ' on' : ''), pressed: s.id === cur ? 'true' : 'false', pick: () => this.setState({ scope: s.id }) })),
      weeks: wk.map((t, j) => ({ t: t, col: j + 2, cls: 'hcell' })),
      lanes: lanes, cells: cells, bars: bars,
      blocked: ws ? blockedAll : blockedAll.slice(0, 2),
      blockedN: ws ? 3 : 2
    };
  }
}
</script>
</body>
</html>
