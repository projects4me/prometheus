Listen 4000

<VirtualHost *:4000>
    ServerAdmin webmaster@localhost
    DocumentRoot /prometheus/dist/
    <Directory "/prometheus/dist/">
        AllowOverride all
        Require all granted
    </Directory>
    <IfModule mod_headers.c>
        Header always set Server-Timing "apache;desc=\"%D\""
    </IfModule>
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
