name: Run Prometheus test cases

on:
  pull_request:
    types: [opened,reopened,synchronize]

jobs:
  Build-and-Test:

    runs-on: ubuntu-latest
    steps:
    - name: Checkout to Repository
      uses: actions/checkout@v3

    # ubuntu-latest ships Google Chrome, which testem launches headless.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Cache Node packages
      id: cache
      uses: actions/cache@v3
      with:
        path: node_modules
        # Keyed on package.json, so a dependency change misses the cache and reinstalls.
        key: npm-node22-${{ hashFiles('package.json') }}

    - name: Install Node modules
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      run: |
        rm -rf node_modules/
        npm install --no-audit --no-fund

    - name: Run Ember test
      run: |
        COVERAGE=true npx ember test

    - name: Upload Code coverage report
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: coverage/