name: Run Prometheus test cases

on:
  pull_request:
    types: [opened,reopened,synchronize]

jobs:
  Build-and-Test:

    runs-on: ubuntu-latest
    container:
      image: rananoman/prometheus:1.0.0
    steps:
    - name: Checkout to Repository
      uses: actions/checkout@v3

    - name: Cache Node packages
      id: cache
      uses: actions/cache@v3
      with:
        path: node_modules
        # Keyed on package.json, so a dependency change misses the cache and reinstalls.
        key: npm-${{ hashFiles('package.json') }}

    # The image's npm 8.1.2 ignores package.json "overrides" (npm >= 8.3), so install with npm 8.19.4 (Node 16 compatible).
    - name: Install Node modules
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      run: |
        rm -rf node_modules/
        npx -y npm@8.19.4 install --no-audit --no-fund

    - name: Run Ember test
      run: |
        COVERAGE=true ember test    

    - name: Upload Code coverage report
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: coverage/