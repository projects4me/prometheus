<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Prometheus Tests</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {{content-for "head"}}
    {{content-for "test-head"}}

    <link rel="stylesheet" href="{{rootURL}}assets/vendor.css">
    <link rel="stylesheet" href="{{rootURL}}assets/prometheus.css">
    <link rel="stylesheet" href="{{rootURL}}assets/test-support.css">

    {{content-for "head-footer"}}
    {{content-for "test-head-footer"}}
  </head>
  <body>
    {{content-for "body"}}
    {{content-for "test-body"}}

    <div id="qunit"></div>
    <div id="qunit-fixture">
      <div id="ember-testing-container">
        <div id="ember-testing"></div>
      </div>
    </div>

    <script src="/testem.js" integrity="" data-embroider-ignore></script>
    <script>
      // ember-cli 4.1's test-support.js hooks Testem in before QUnit exists (ember-qunit 9 loads QUnit
      // through ember-auto-import, later). Skip that early call, as ember-cli 4.12 does; ember-qunit
      // hooks Testem in once QUnit has loaded. Drop this when ember-cli is 4.12 or newer.
      if (typeof Testem !== 'undefined') {
        var hookIntoTestFramework = Testem.hookIntoTestFramework;
        Testem.hookIntoTestFramework = function () {
          if (typeof QUnit !== 'undefined') {
            hookIntoTestFramework.apply(this, arguments);
          }
        };
      }
    </script>
    <script src="{{rootURL}}assets/vendor.js"></script>
    <script src="{{rootURL}}assets/test-support.js"></script>
    <script src="{{rootURL}}assets/prometheus.js"></script>
    <script src="{{rootURL}}assets/tests.js"></script>

    {{content-for "body-footer"}}
    {{content-for "test-body-footer"}}
  </body>
</html>
